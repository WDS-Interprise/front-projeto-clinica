<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A ClinMax é a plataforma de gestão clínica e prontuário eletrônico para consultórios e equipes. Agenda, prontuário, prescrições, WhatsApp e finanças."
    />
    <link rel="canonical" href="https://clinmax.com.br/" />
    <meta property="og:title" content="ClinMax: Gestão clínica" />
    <meta property="og:description" content="A ClinMax é a plataforma de gestão clínica e prontuário eletrônico para consultórios e equipes. Agenda, prontuário, prescrições, WhatsApp e finanças." />
    <meta property="og:url" content="https://clinmax.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://clinmax.com.br/favicon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "ClinMax",
            "url": "https://clinmax.com.br/",
            "logo": "https://clinmax.com.br/favicon.png",
            "email": "contato@clinmax.com.br"
          },
          {
            "@type": "WebSite",
            "name": "ClinMax",
            "url": "https://clinmax.com.br/",
            "description": "A ClinMax é a plataforma de gestão clínica e prontuário eletrônico para consultórios e equipes. Agenda, prontuário, prescrições, WhatsApp e finanças."
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ClinMax: Gestão clínica</title>
    <script>
      (function () {
        try {
          var key = "clinichub_theme";
          var flag = "clinichub_theme_default";
          if (localStorage.getItem(flag) !== "dark") {
            localStorage.setItem(key, "dark");
            localStorage.setItem(flag, "dark");
          }
          var path = location.pathname.replace(/\/+$/, "") || "/";
          var landing = path === "/";
          var theme = landing || localStorage.getItem(key) === "light" ? "light" : "dark";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
